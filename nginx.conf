# nginx.conf for Formblatt
# Configured for client-side execution, PWA caching, and security headers.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Explicit MIME types for WebAssembly, JSON manifest, and Markdown
    types {
        application/wasm                     wasm;
        application/manifest+json            webmanifest;
        text/markdown                        txt md;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip compression for static assets
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;
        root   /usr/share/nginx/html;
        index  index.html;

        # Standard Security Headers matching vercel.json
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Healthcheck endpoint
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        # Cache static immutable assets (fonts, images, vendor libraries)
        location ~* ^/(fonts|assets|vendor)/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # AI doc context routes
        location = /llms.txt {
            default_type "text/markdown; charset=utf-8";
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        location = /llms-full.txt {
            default_type "text/markdown; charset=utf-8";
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        location = /.well-known/llms.txt {
            alias /usr/share/nginx/html/llms.txt;
            default_type "text/markdown; charset=utf-8";
        }

        location = /.well-known/llms-full.txt {
            alias /usr/share/nginx/html/llms-full.txt;
            default_type "text/markdown; charset=utf-8";
        }

        # Service Worker & manifest must not be cached aggressively
        location = /sw.js {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /site.webmanifest {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # Application core fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
