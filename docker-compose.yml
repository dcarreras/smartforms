services:
  smartforms:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartforms:latest
    container_name: smartforms-web
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
